<main class="not-found" [attr.dir]="ui.locale() === 'en' ? 'ltr' : 'rtl'" [attr.lang]="ui.locale()">
  <div class="not-found__card">
    <p class="not-found__code" aria-hidden="true">404</p>
    <h1 class="not-found__title">{{ 'notFoundTitle' | uiTranslate }}</h1>
    <p class="not-found__body">{{ 'notFoundDescription' | uiTranslate }}</p>
    <a routerLink="/" class="not-found__link">{{ 'notFoundBackHome' | uiTranslate }}</a>
  </div>
</main>
