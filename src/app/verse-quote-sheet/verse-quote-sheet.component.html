<div
  class="quote-sheet"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'quoteSheetTitle' | uiTranslate"
  (click)="onBackdropClick($event)"
>
  <section class="quote-sheet__panel" (click)="$event.stopPropagation()">
    <header class="quote-sheet__head">
      <h2 class="quote-sheet__title">{{ 'quoteSheetTitle' | uiTranslate }}</h2>
      <button
        type="button"
        class="quote-sheet__close"
        (click)="close()"
        [attr.aria-label]="'quoteSheetCloseAria' | uiTranslate"
      >
        ✕
      </button>
    </header>

    <app-quote-preview
      [previewUrl]="preview.previewUrl()"
      [generating]="preview.generating()"
      [format]="format()"
      [ayahLabel]="ayahLabel()"
    />

    <app-quote-format-picker [selected]="format()" (selectedChange)="setFormat($event)" />

    <app-quote-translation-options
      [includeEn]="includeEn()"
      [includeUr]="includeUr()"
      (includeEnChange)="onIncludeEnChange($event)"
      (includeUrChange)="onIncludeUrChange($event)"
    />

    <app-quote-export-actions
      [busy]="busy()"
      [disabled]="preview.generating() || !preview.previewUrl()"
      (download)="downloadImage()"
      (share)="shareImage()"
    />
  </section>
</div>
