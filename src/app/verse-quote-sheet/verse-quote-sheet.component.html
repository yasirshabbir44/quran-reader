<div
  class="quote-sheet"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'quoteSheetTitle' | uiTranslate"
  (click)="onBackdropClick($event)"
>
  <section class="quote-sheet__panel" (click)="$event.stopPropagation()">
    <header class="quote-sheet__head">
      <h2 class="quote-sheet__title">{{ 'quoteSheetTitle' | uiTranslate }}</h2>
      <button
        type="button"
        class="quote-sheet__close"
        (click)="close()"
        [attr.aria-label]="'quoteSheetCloseAria' | uiTranslate"
      >
        ✕
      </button>
    </header>

    <div class="quote-sheet__preview-wrap">
      @if (previewUrl(); as src) {
      <img
        class="quote-sheet__preview"
        [class.quote-sheet__preview--story]="format() === 'story'"
        [src]="src"
        [attr.alt]="'quoteSheetPreviewAlt' | uiTranslate: { n: formatUiNum()(verse().ayah) }"
      />
      } @else {
      <p class="quote-sheet__preview-placeholder" aria-live="polite">
        {{ 'quoteSheetGenerating' | uiTranslate }}
      </p>
      }
    </div>

    <fieldset class="quote-sheet__fieldset">
      <legend class="quote-sheet__legend">{{ 'quoteSheetFormatLabel' | uiTranslate }}</legend>
      <div class="quote-sheet__format-row">
        @for (f of formats; track f) {
        <button
          type="button"
          class="quote-sheet__chip"
          [class.quote-sheet__chip--active]="format() === f"
          (click)="setFormat(f)"
        >
          @switch (f) {
            @case ('instagram') {
              {{ 'quoteSheetFormatInstagram' | uiTranslate }}
            }
            @case ('story') {
              {{ 'quoteSheetFormatStory' | uiTranslate }}
            }
            @case ('twitter') {
              {{ 'quoteSheetFormatTwitter' | uiTranslate }}
            }
          }
        </button>
        }
      </div>
    </fieldset>

    <fieldset class="quote-sheet__fieldset">
      <legend class="quote-sheet__legend">{{ 'quoteSheetIncludeLabel' | uiTranslate }}</legend>
      <label class="quote-sheet__check">
        <input
          type="checkbox"
          [ngModel]="includeEn()"
          (ngModelChange)="onIncludeEnChange($event)"
        />
        <span>{{ 'quoteSheetIncludeEn' | uiTranslate }}</span>
      </label>
      <label class="quote-sheet__check">
        <input
          type="checkbox"
          [ngModel]="includeUr()"
          (ngModelChange)="onIncludeUrChange($event)"
        />
        <span>{{ 'quoteSheetIncludeUr' | uiTranslate }}</span>
      </label>
    </fieldset>

    <div class="quote-sheet__actions">
      <button
        type="button"
        class="quote-sheet__btn quote-sheet__btn--primary"
        [disabled]="busy() || generating() || !previewUrl()"
        (click)="downloadImage()"
      >
        {{ 'quoteSheetDownload' | uiTranslate }}
      </button>
      <button
        type="button"
        class="quote-sheet__btn"
        [disabled]="busy() || generating() || !previewUrl()"
        (click)="shareImage()"
      >
        {{ 'quoteSheetShare' | uiTranslate }}
      </button>
    </div>
  </section>
</div>
