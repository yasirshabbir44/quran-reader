<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Preservation of the Quran">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a28"/>
      <stop offset="100%" style="stop-color:#0a1a12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="320" y="100" width="160" height="220" rx="6" fill="#1e4a32" stroke="#c9a227" stroke-width="2"/>
  <line x1="340" y1="140" x2="460" y2="140" stroke="#c9a227" stroke-width="1" opacity="0.5"/>
  <line x1="340" y1="170" x2="460" y2="170" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
  <line x1="340" y1="200" x2="460" y2="200" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
  <text x="400" y="370" text-anchor="middle" fill="#e8d5a3" font-family="Georgia,serif" font-size="32" font-weight="bold">Quran Preserved</text>
  <text x="400" y="405" text-anchor="middle" fill="#98b8a8" font-family="sans-serif" font-size="15">From revelation to today</text>
</svg>
